spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5434/user_service_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  error:
    include-stacktrace: never
